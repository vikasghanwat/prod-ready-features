spring.application.name=prod-ready-features

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/prod-ready-features
spring.datasource.username=root
spring.datasource.password=#MySQLdatabase

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernet.dialect=org.hibernet.dialect.MySQL8Dialect

server.port=9090
employeeService.base.url = http://localhost:8080/

#logging configuration
logging.level.com.prod_ready_features.clients.impl=trace
logging.level.com.prod_ready_features.config=INFO
logging.pattern.console=%d{dd-mm-yyyy hh:MM:ss} [%level] %c{1.} --- %m%n
logging.file.name=application.log
logging.config=classpath:logback-spring.xml